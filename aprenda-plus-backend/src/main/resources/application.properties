spring.application.name=aprenda_plus

spring.datasource.url=jdbc:postgresql://localhost:5432/aprenda_plus
spring.datasource.username=postgres
spring.datasource.password=6521

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET:chave-local-apenas-para-desenvolvimento-com-mais-de-32-caracteres}
# Upload do certificado de conclusão (o sistema aceita até 5 MB; a folga é para os outros campos)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# E-mails (Brevo). Sem a chave, o sistema funciona e só não envia.
brevo.api-key=${BREVO_API_KEY:}
email.remetente=${EMAIL_REMETENTE:}
email.site=${EMAIL_SITE:https://nattalyb.github.io/aprenda-plus/}
